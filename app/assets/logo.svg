  <path d="M60 134 c6 42 42 56 68 56 s62 -14 68 -56 l-18 10 c-5 24 -28 32 -50 32 s-45 -8 -50 -32 z" fill="url(#amber)"/>
  <path d="M56 128 l22 -4 l-6 22 z" fill="url(#amber)"/>
