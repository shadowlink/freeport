<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e30"/>
      <stop offset="1" stop-color="#0a0b12"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse"
      x1="300" y1="230" x2="724" y2="790">
      <stop offset="0" stop-color="#ffd777"/>
      <stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#ffb23e" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ffb23e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#glow)"/>
  <rect x="73" y="73" width="878" height="878" rx="203" fill="none" stroke="#2a2e45" stroke-width="6"/>

  <!-- anchor: soft glow behind -->
  <g filter="url(#soft)" opacity="0.6">
    <circle cx="512" cy="292" r="58" fill="none" stroke="url(#gold)" stroke-width="46"/>
    <rect x="489" y="350" width="46" height="392" rx="23" fill="url(#gold)"/>
    <rect x="392" y="405" width="240" height="46" rx="23" fill="url(#gold)"/>
    <path d="M300 556 C 300 704, 410 752, 512 744 C 614 752, 724 704, 724 556"
          fill="none" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>
  </g>

  <!-- anchor: main -->
  <g fill="url(#gold)">
    <!-- ring -->
    <circle cx="512" cy="292" r="58" fill="none" stroke="url(#gold)" stroke-width="46"/>
    <!-- shank -->
    <rect x="489" y="350" width="46" height="392" rx="23"/>
    <!-- stock (crossbar) -->
    <rect x="392" y="405" width="240" height="46" rx="23"/>
    <!-- crown / arms -->
    <path d="M300 556 C 300 704, 410 752, 512 744 C 614 752, 724 704, 724 556"
          fill="none" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>
    <!-- flukes (barbed tips) -->
    <path d="M300 588 L246 548 L332 486 Z"/>
    <path d="M724 588 L778 548 L692 486 Z"/>
  </g>
</svg>
