[package]
name = "freeport"
version = "0.2.78"
edition = "2021"
license = "MIT"

[[bin]]
name = "freeport"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1", features = ["unstable-fontique-010"] }
i-slint-backend-winit = "=1.17.1"
freeport-core = { path = "../core" }
glow = "0.17"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = "0.15"
open = "5"
