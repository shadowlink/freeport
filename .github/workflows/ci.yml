name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias (Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
