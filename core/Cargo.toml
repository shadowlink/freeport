[package]
name = "freeport-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "freeport_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
regex = "1"
zip = "2"
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
zstd = "0.13"
ar = "0.9"
dirs = "5"
thiserror = "2"
urlencoding = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
discord-rich-presence = "0.2"
gilrs = "0.11"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
steam_shortcuts_util = "1"
sevenz-rust = "0.6"
