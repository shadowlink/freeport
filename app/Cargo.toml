[package]
name = "freeport"
version = "0.2.12"
edition = "2021"

[[bin]]
name = "freeport"
path = "src/main.rs"

[build-dependencies]
slint-build = "1"

[dependencies]
slint = "1"
i-slint-backend-winit = "=1.17.1"
freeport-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = "0.15"
open = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
