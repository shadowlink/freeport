name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (p. ej. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build
        run: cargo build --release -p freeport -p signer --locked

      - name: Empaquetar AppImage
        run: |
          curl -sL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp target/release/freeport AppDir/usr/bin/freeport
          export APPIMAGE_EXTRACT_AND_RUN=1 NO_STRIP=1
          ./linuxdeploy --appdir AppDir \
            -e AppDir/usr/bin/freeport \
            -d packaging/freeport.desktop \
            -i packaging/freeport.png \
            --output appimage

      - name: Firmar + manifest latest.json
        env:
          FREEPORT_UPDATER_KEY: ${{ secrets.FREEPORT_UPDATER_KEY }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          SIG=$(target/release/signer Freeport-x86_64.AppImage)
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/Freeport-x86_64.AppImage"
          printf '{"version":"%s","notes":"","platforms":{"linux":{"url":"%s","signature":"%s"}}}\n' \
            "$VER" "$URL" "$SIG" > latest.json
          cat latest.json

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Freeport ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            Freeport — launcher nativo (Slint) de decompilaciones y ports de consola a PC.
            Linux: `Freeport-x86_64.AppImage` (portable). Auto-actualización integrada.
          files: |
            Freeport-x86_64.AppImage
            latest.json
